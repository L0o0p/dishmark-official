name: Deploy Next.js to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install deps
        run: corepack yarn install --immutable

      - name: Run tests if present
        run: npm test --if-present

      - name: Create release package
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.github' \
            -czf release.tgz .

      - name: Upload release package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "release.tgz"
          target: "/tmp"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            APP_DIR=/opt/apps/loopshen-top
            RELEASE_DIR=/opt/apps/loopshen-top-release

            rm -rf $RELEASE_DIR
            mkdir -p $RELEASE_DIR
            tar -xzf /tmp/release.tgz -C $RELEASE_DIR

            cd $RELEASE_DIR
            corepack yarn install --immutable
            corepack yarn build

            rm -rf $APP_DIR
            mv $RELEASE_DIR $APP_DIR

            systemctl restart loopshen-next
            systemctl status loopshen-next --no-pager
